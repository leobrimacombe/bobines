# Compile l'appli Mac et la publie dans les Releases GitHub quand on pousse un tag « app-v1.2.3 ».
# L'appli installée chez l'utilisateur vérifie ces Releases au démarrage et propose la mise à jour.
name: Release appli Mac

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest # Mac à puce Apple, comme le Mac mini M4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # La version de l'appli vient du tag : app-v1.2.3 → 1.2.3
      - name: Version depuis le tag
        run: npm version "${GITHUB_REF_NAME#app-v}" --no-git-tag-version --allow-same-version

      - name: Compilation
        run: npm run dist:mac -- --publish never

      # Le message du tag (git tag -a ... -m "...") devient le texte « Nouveautés » affiché dans l'appli
      - name: Publication
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "SpoolTracker ${GITHUB_REF_NAME#app-v}" --notes-from-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
