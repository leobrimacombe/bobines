appId: com.leobrimacombe.spooltracker
productName: SpoolTracker
copyright: Léo Brimacombe

directories:
  output: dist
  buildResources: build

# Code de l'appli Electron uniquement
files:
  - electron/**/*
  - package.json

# Le serveur Next.js autonome, hors de l'archive asar (il doit pouvoir faire un chdir dedans)
extraResources:
  - from: .next/standalone
    to: server
    filter:
      - "**/*"
  # electron-builder écarte toujours les node_modules d'un dossier copié : on les ajoute à part
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter:
      - "**/*"

mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.productivity
  icon: build/icon.png
  # Signature « ad hoc » gratuite (pas de compte développeur Apple) : obligatoire sur puce M
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false

dmg:
  title: SpoolTracker ${version}
  artifactName: SpoolTracker-${version}-arm64.${ext}

win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.png
  # Pas de certificat (payant) : Windows affichera l'avertissement SmartScreen à la première installation
  signAndEditExecutable: true

# Installeur en un clic, pour l'utilisateur courant (pas besoin de droits administrateur).
# Relancer un installeur plus récent met simplement l'appli à jour, les données restent dans %APPDATA%\SpoolTracker
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SpoolTracker
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: SpoolTracker-${version}-Setup.${ext}

# La publication est faite par le workflow GitHub (.github/workflows/release.yml)
publish: null
